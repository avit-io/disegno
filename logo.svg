<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Disegno">
  <title>Disegno</title>
  <!-- Euclide I.1: il triangolo equilatero costruito con due cerchi. Una costruzione che è una prova. -->
  <g fill="none" stroke="#a5452f" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="70" cy="100" r="60" stroke-width="2" opacity="0.7"/>
    <circle cx="130" cy="100" r="60" stroke-width="2" opacity="0.7"/>
    <line x1="100" y1="22" x2="100" y2="178" stroke-width="1.5" opacity="0.55" stroke-dasharray="3 5"/>
    <polygon points="70,100 130,100 100,48.04" stroke-width="5"/>
  </g>
  <g fill="#a5452f">
    <circle cx="70" cy="100" r="5"/>
    <circle cx="130" cy="100" r="5"/>
    <circle cx="100" cy="48.04" r="5"/>
  </g>
</svg>
