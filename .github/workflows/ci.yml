# Disegno's CI. The main step is a Disegno program (ci.disegno): the test suite in a container,
# run by Dagger. In CI `disegno run` shows no TUI: each with-exec is a log group, and a failed
# step an annotation on the source.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Binary and Neovim plugin
        run: nix build .#default .#nvim-disegno --print-build-logs

      - name: Disegno's CI, in Disegno
        run: nix run . -- run ci.disegno

      - name: Test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-log
          path: ci-out/
          if-no-files-found: ignore

  # The full suite under a Dagger session: the live part too (plans run, per-step logs,
  # positions of failed steps).
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Live tests
        # If it fails, the last lines become annotations: they are read from the run's summary.
        run: |
          s=0; nix develop -c sh -c 'dagger api with-session scheme --script tests/test.ss' >live.log 2>&1 || s=$?
          cat live.log
          if [ $s != 0 ]; then { grep -E 'Exception|assertion' live.log; grep -v '^\s*$' live.log | tail -8; } | sed 's/^/::error::/'; fi
          exit $s

  # Disegno as an image, for CIs without Nix: ghcr.io/avit-io/disegno:<commit> and :latest,
  # only from main and after the tests. The printed digest is the one to pin wherever it is used.
  image:
    needs: [ci, live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Image
        run: nix build .#image -o result-image && docker load < result-image
      - name: Publish to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/avit-io/disegno:latest "ghcr.io/avit-io/disegno:${{ github.sha }}"
          docker push "ghcr.io/avit-io/disegno:${{ github.sha }}"
          docker push ghcr.io/avit-io/disegno:latest
          docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/avit-io/disegno:${{ github.sha }}"
